<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Hexagone arc-en-ciel animé">
<title>Hexagone prismatique animé — Triade d’Hackénia</title>
<defs>
 <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ff426b"/><stop offset=".16" stop-color="#ffb33c"/><stop offset=".33" stop-color="#fff27a"/><stop offset=".5" stop-color="#54f9b5"/><stop offset=".67" stop-color="#5bb8ff"/><stop offset=".84" stop-color="#aa73ff"/><stop offset="1" stop-color="#ff63db"/>
 </linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27204c" stop-opacity=".97"/><stop offset=".55" stop-color="#10182d" stop-opacity=".92"/><stop offset="1" stop-color="#39204b" stop-opacity=".98"/></linearGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
 <clipPath id="hex"><polygon points="60,7 105.9,33.5 105.9,86.5 60,113 14.1,86.5 14.1,33.5"/></clipPath>
</defs>
<!-- Soft chromatic aura -->
<polygon points="60,5 107.6,32.5 107.6,87.5 60,115 12.4,87.5 12.4,32.5" fill="none" stroke="url(#prism)" stroke-width="7" opacity=".55" filter="url(#glow)">
 <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="14s" repeatCount="indefinite"/>
 <animate attributeName="opacity" values=".38;.75;.38" dur="3.4s" repeatCount="indefinite"/>
</polygon>
<!-- Faceted body -->
<polygon points="60,6 106.8,33 106.8,87 60,114 13.2,87 13.2,33" fill="url(#glass)" stroke="#f8e7ff" stroke-width="1.4"/>
<g clip-path="url(#hex)" opacity=".26">
 <path d="M60 60 60 6 107 33Z" fill="#fa6baf"/><path d="M60 60 107 33 107 87Z" fill="#56c8ff"/><path d="M60 60 107 87 60 114Z" fill="#7c68ff"/><path d="M60 60 60 114 13 87Z" fill="#41e9b0"/><path d="M60 60 13 87 13 33Z" fill="#ffd861"/><path d="M60 60 13 33 60 6Z" fill="#ff8b67"/>
</g>
<!-- Rotating iridescent light traveling around rim -->
<polygon points="60,8 104.9,34 104.9,86 60,112 15.1,86 15.1,34" fill="none" stroke="url(#prism)" stroke-width="5" stroke-linejoin="round" stroke-dasharray="88 18 24 18 65 20">
 <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="7s" repeatCount="indefinite"/>
</polygon>
<polygon points="60,17 97.2,38.5 97.2,81.5 60,103 22.8,81.5 22.8,38.5" fill="none" stroke="#e5d9ff" stroke-opacity=".65" stroke-width="1.3"/>
<polygon points="60,22 92.8,41 92.8,79 60,98 27.2,79 27.2,41" fill="none" stroke="url(#prism)" stroke-width="1.6" opacity=".75">
 <animate attributeName="opacity" values=".35;.95;.35" dur="3.2s" repeatCount="indefinite"/>
</polygon>
<!-- Central readable score stays unobstructed -->
<path d="M37 45 60 31 83 45 M37 75 60 89 83 75" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/>
<!-- Glints -->
<g fill="#fff">
 <path d="M60 1 61.8 5.4 66 7 61.8 8.6 60 13 58.2 8.6 54 7 58.2 5.4Z"><animate attributeName="opacity" values=".25;1;.25" dur="2.6s" repeatCount="indefinite"/></path>
 <path d="M108 24 109.2 27 112 28.2 109.2 29.4 108 32.4 106.8 29.4 104 28.2 106.8 27Z"><animate attributeName="opacity" values="1;.15;1" dur="3.1s" repeatCount="indefinite"/></path>
 <circle cx="12" cy="94" r="1.5"><animate attributeName="opacity" values=".1;1;.1" dur="2.1s" repeatCount="indefinite"/></circle>
</g>
<style>@media (prefers-reduced-motion:reduce){animate,animateTransform{display:none}}</style>
</svg>