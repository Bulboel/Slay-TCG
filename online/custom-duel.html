<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triade of Hackenia — Decks personnels</title><style>
*{box-sizing:border-box}body{background:radial-gradient(circle at top,#61482d,#162330 70%);color:#f4e1b5;font:16px system-ui;margin:0;padding:14px}main{max-width:850px;margin:auto}h1{text-align:center;font-family:Georgia,serif}p{line-height:1.5}button,input{font:inherit;border-radius:8px;padding:10px}button{background:#e3c486;color:#251b11;border:1px solid #f5d99f;cursor:pointer}button:disabled{opacity:.45}input{width:130px;text-transform:uppercase}header,.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}#roomInfo,#status{text-align:center;padding:10px;min-height:35px}#board{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:radial-gradient(circle at center,#c6a66c,#75512c 85%);border:8px ridge #c8a56c;border-radius:17px;padding:8px;aspect-ratio:1;margin:12px auto;max-width:490px;box-shadow:0 14px 40px #0009,inset 0 0 30px #29190e}.cell{background:radial-gradient(circle at 50% 40%,#f2ddb1,#d2ae75);display:grid;place-items:center;border:2px solid #896333;padding:2px;min-width:0;box-shadow:inset 0 0 15px #75532a77;transition:background .2s} .cell:not(:disabled):hover{background:#f8e4b4;box-shadow:inset 0 0 16px #fff8bd,0 0 10px #f6d487}.card{background:#203c3d;color:white;border:3px solid #6ac782;border-radius:9px;position:relative;aspect-ratio:3/4;width:100%;display:grid;place-items:center;font-weight:700;font-size:clamp(10px,2vw,14px)}.guest{border-color:#ef8383;background:#4d2c38}.card span{position:absolute}.t{top:2px}.r{right:5px}.b{bottom:2px}.l{left:5px}.card strong{font-size:clamp(9px,2vw,13px)}.hand{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}.hand button{width:18%;padding:2px;min-width:55px;background:transparent;border:2px solid transparent}.hand button.active{border-color:#ffdd77}.hand .card{width:100%}.label{text-align:center;font-weight:700;margin:14px 0 6px}.note{font-size:.85rem;color:#d2c19e}#roomPanel{border:1px solid #a88953;border-radius:12px;padding:12px}.card{overflow:hidden;isolation:isolate;box-shadow:0 5px 12px #0008;transition:transform .22s ease,border-color .2s ease}
.card::before{content:'';position:absolute;inset:0;z-index:-1;background-image:var(--card-art);background-size:var(--card-size,300% 300%);background-position:var(--card-pos);background-repeat:no-repeat;filter:saturate(1.07)}
.card::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#0008 0%,transparent 30%,transparent 55%,#000b 100%)}
.card span{z-index:2;text-shadow:0 1px 4px #000,0 0 3px #000;font-size:clamp(11px,2.5vw,19px)}
.card strong{z-index:2;position:absolute;bottom:20%;max-width:94%;padding:3px;background:#101720a6;border-radius:4px;text-align:center;text-shadow:0 1px 4px #000}
.hand button:not(:disabled):hover .card{transform:translateY(-6px) scale(1.04)}
.hand button.active .card{box-shadow:0 0 0 3px #ffdc6c,0 0 18px #ffdd78}
.cell .card.just-placed{animation:triade-arrive .3s ease-out both}.cell .card.just-captured{animation:triade-capture .6s ease-out both}@keyframes triade-capture{0%{transform:rotateY(0deg);filter:brightness(1)}45%{transform:rotateY(90deg);filter:brightness(1.7)}100%{transform:rotateY(0deg);filter:brightness(1)}}#status{font-weight:700;letter-spacing:.025em}#status.game-result{font-size:clamp(22px,4vw,34px);color:#fbe09c;text-shadow:0 0 15px #e8b765}
@media (max-width:900px){.cell .card,.cell .card.just-placed{animation:none!important;transition:none!important}}
@keyframes triade-arrive{from{opacity:.5;transform:scale(.82) rotate(-3deg)}to{opacity:1;transform:scale(1)}}
#gamePanel[hidden]{display:none}
/* Plateau et animations réutilisés depuis le jeu principal */
#onlineBoardWrap{position:relative;padding:24px;border-radius:34px;background:radial-gradient(circle at 18% 12%,#e8d08c55 0 1px,transparent 2px),linear-gradient(135deg,#d8bd72,#9a682b 48%,#543618);background-size:17px 17px,auto;box-shadow:0 32px 85px #000c,inset 0 0 0 3px #fff1a84d,inset 0 0 38px #37200d;transform:perspective(1100px) rotateX(1deg)}#onlineBoardWrap:before{content:'';position:absolute;inset:-10px;border-radius:40px;z-index:-1;background:radial-gradient(ellipse at 7% 12%,#7fa348 0 6%,transparent 14%),radial-gradient(ellipse at 93% 18%,#557b39 0 7%,transparent 15%),radial-gradient(ellipse at 12% 92%,#436c36 0 7%,transparent 15%),radial-gradient(ellipse at 90% 88%,#86a64d 0 6%,transparent 14%),linear-gradient(135deg,#294525,#172817);filter:drop-shadow(0 14px 18px #0008)}#onlineBoardWrap:after{content:'❧  ❧';position:absolute;left:-18px;right:-18px;bottom:-20px;color:#89aa55;font-size:2.2rem;letter-spacing:14px;text-shadow:0 4px 8px #10200c;display:flex;justify-content:space-between;pointer-events:none}#board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding:12px;background:linear-gradient(#d7c28eeb,#b49a63eb),radial-gradient(circle,#5f4321 0 1px,transparent 2px);background-blend-mode:multiply;border:2px solid #4d351b;border-radius:18px;box-shadow:inset 0 0 40px #62461f99}#board .cell{min-width:0;border:2px solid #76572e99;border-radius:15px;background:linear-gradient(145deg,#ddca98cc,#b69d68cc);box-shadow:inset 0 0 22px #5b421d35;display:grid;place-items:center;position:relative;cursor:pointer;transition:.2s ease;overflow:visible}#board .cell:empty:hover,#board .cell.drop-target{border-color:#f2d677;background:#e2cc98;box-shadow:inset 0 0 30px #fff3b75c,0 0 22px #f8c75b4d;transform:scale(.98)}#board .cell:empty:after{content:'✦';font-size:1.6rem;color:#62491f3a;transition:.2s}#board .cell.drop-target:after{color:#9b6a17;transform:scale(1.3)}#board .cell #board .card{width:auto;height:94%;max-height:none}#board .cell.placed #board .card{animation:land .42s cubic-bezier(.2,.9,.2,1)}#board .cell.captured #board .card{animation:captureGlow 1.12s ease both}#board .cell.captured #board .card:after{content:'';position:absolute;inset:-25%;z-index:6;pointer-events:none;border-radius:50%;background:conic-gradient(#ff4b55,#ff9f43,#ffe66d,#4cd964,#45d6e8,#5b8cff,#b56cff,#ff4b55);filter:blur(10px);mix-blend-mode:screen;animation:rainbowHalo 1.12s ease both}@keyframes land{0%{transform:translateY(-32px) scale(1.14);opacity:.15}70%{transform:translateY(5px) scale(.98)}100%{transform:none;opacity:1}}@keyframes captureGlow{0%{filter:brightness(1) drop-shadow(0 0 0 transparent);transform:rotateY(0) scale(1)}38%{filter:brightness(1.55) drop-shadow(0 0 20px #ffe66d);transform:rotateY(88deg) scale(1.1)}58%{filter:brightness(2) drop-shadow(0 0 34px var(--capture));transform:rotateY(272deg) scale(1.1)}100%{filter:brightness(1) drop-shadow(0 0 8px var(--capture));transform:rotateY(360deg) scale(1)}}@keyframes rainbowHalo{0%,100%{opacity:0;transform:scale(.45) rotate(0)}35%{opacity:.7;transform:scale(1.15) rotate(90deg)}55%{opacity:.95;transform:scale(1.32) rotate(190deg)}75%{opacity:.45;transform:scale(1.1) rotate(290deg)}}
#onlineBoardWrap{width:min(100%,530px);margin:18px auto;padding:15px;isolation:isolate}
#board{max-width:none;margin:0;gap:7px;padding:8px}
#board .cell{overflow:hidden}
#board .cell .card{width:100%;height:auto;max-height:100%}
#board .cell.just-placed .card{animation:land .42s cubic-bezier(.2,.9,.2,1)}
#board .cell.just-captured .card{--capture:#f4cc72;animation:captureGlow 1.12s ease both}
@media(max-width:700px){#onlineBoardWrap{padding:10px;width:min(100%,470px)}#board{gap:4px;padding:5px}}
</style></head><body><main><h1>⚔ Triade d’Hackénia — Duel en ligne</h1><p class="note">Choisis ton deck personnel et affronte ton adversaire. Règles classiques pour le moment.</p><section id="deckPanel"><div class="label">Mon deck personnel</div><select id="myDeck" style="width:100%;padding:10px;margin-bottom:8px"></select><button id="submitDeck">Valider mon deck pour ce salon</button><p id="deckInfo" class="note"></p></section><section id="roomPanel"><div class="actions"><button id="create">Créer une salle</button><input id="code" maxlength="6" placeholder="Code à 6 caractères" aria-label="Code du salon"><button id="join">Rejoindre</button></div><div id="roomInfo"></div><div class="actions"><button id="copy" hidden>📋 Copier le code</button><button id="start" hidden>Démarrer le duel</button></div></section><div id="status" role="status"></div><section id="gamePanel" hidden><div class="label">Main du joueur rouge</div><div class="hand" id="guestHand"></div><div id="onlineBoardWrap"><div id="board"></div></div><div class="label">Main du joueur vert</div><div class="hand" id="hostHand"></div></section><p class="note"><a style="color:#efd18e" href="../index.html">Retour au jeu</a></p></main><script type="module">
import {supabase,ensureOnlineIdentity,createOnlineRoom,joinOnlineRoom,getOnlineRoom} from './supabase-client.js';
const $=id=>document.getElementById(id);
const artwork = {
  'Kala':27,'Bolduc':4,'Jhimm':23,'Grimgors':13,'Araignée':2,
  'Hilam':15,'Kayla':29,'Gardienne':11,'Frolgor':10,'Ven':42
};
const localDecks=JSON.parse(localStorage.getItem('triade-online-deck-snapshot')||'[]');
const decks={host:[],guest:[]};
const deckSelect=$('myDeck');
for(const deck of localDecks){const option=document.createElement('option');option.value=deck.id;option.textContent=deck.name;deckSelect.append(option)}
$('deckInfo').textContent=localDecks.length?'Sélectionne ton deck puis crée ou rejoins un salon.':'Aucun deck transféré. Retourne au menu PVP du jeu et utilise « Jouer avec mes decks ».';
function selectedLocalDeck(){return localDecks.find(d=>String(d.id)===deckSelect.value)}
function showDeckValues(){const d=selectedLocalDeck();if(!d)return;$('deckInfo').textContent='Deck : '+d.cards.map(c=>c.name+' ['+(Array.isArray(c.v)?c.v.map(v=>JSON.stringify(v)).join(', '):'statistiques absentes')+']').join(' · ')}
deckSelect.addEventListener('change',showDeckValues);showDeckValues();
function setDecks(rows){for(const player of ['host','guest']){const row=rows.find(d=>d.player_id===room[player+'_id']);decks[player]=row?row.cards.map(c=>[c.name,c.v,c]):[]}}

let roomId=null,role=null,game=null,room=null,selected=null,working=false;
let previousBoard=null, previousRoomId=null, lastRenderedState=null, persistentError=null;
function say(message){$('status').textContent=persistentError||message}
function card(name,v,owner,meta){const d=document.createElement('div');d.className='card '+owner;d.innerHTML='<span class="t">'+v[0]+'</span><span class="r">'+v[1]+'</span><span class="b">'+v[2]+'</span><span class="l">'+v[3]+'</span><strong></strong>';d.querySelector('strong').textContent=name;
const img=meta?.image;
if(img?.src && typeof img.src==='string' && !/^([a-z]+:|\/\/|\/)/i.test(img.src)){
  d.style.setProperty('--card-art',`url("../${img.src.replace(/"/g,'%22')}")`);
  if(img.full){d.style.setProperty('--card-size','cover');d.style.setProperty('--card-pos','center');}
  else if(Number.isFinite(Number(img.x))&&Number.isFinite(Number(img.y))){d.style.setProperty('--card-pos',(Number(img.x)*50)+'% '+(Number(img.y)*50)+'%');}
}else{const n=artwork[name];if(n){const sheet=Math.floor((n-1)/9)+1,x=(n-1)%3,y=Math.floor(((n-1)%9)/3);d.style.setProperty('--card-art',"url('../assets/cards/s"+sheet+".webp')");d.style.setProperty('--card-pos',(x*50)+'% '+(y*50)+'%');}}
return d}
async function load(){if(!roomId)return;room=await getOnlineRoom(roomId);const user=await ensureOnlineIdentity();role=room.host_id===user.id?'host':'guest';$('roomInfo').textContent='Salle '+room.room_code+' — '+(room.guest_id?'2 joueurs connectés':'en attente du second joueur');$('copy').hidden=false;
const {data:deckRows,error:deckError}=await supabase.from('slay_custom_duel_decks').select('player_id,cards').eq('room_id',roomId);if(deckError)throw deckError;setDecks(deckRows||[]);
$('deckInfo').textContent='Decks validés : '+(decks.host.length?'vert ✓':'vert en attente')+' · '+(decks.guest.length?'rouge ✓':'rouge en attente');
const {data,error}=await supabase.from('slay_custom_duel_games').select('*').eq('room_id',roomId).maybeSingle();if(error){if(error.code==='42P01'){say('Exécute d’abord le script SQL de synchronisation dans Supabase.');return}throw error}game=data;$('start').hidden=!!game||!room.guest_id||decks.host.length!==5||decks.guest.length!==5;if(game)render();else if(room.guest_id&&decks.host.length===5&&decks.guest.length===5)say('Les deux decks sont prêts ! Clique sur « Démarrer le duel ».');else say('En attente des deux decks : chaque joueur doit cliquer sur « Valider mon deck ».');}
function render(){const stateKey=JSON.stringify({roomId,role,board:game.board,turn:game.turn,winner:game.winner,move_count:game.move_count,selected});
if(stateKey===lastRenderedState)return;
lastRenderedState=stateKey;
$('gamePanel').hidden=false;$('start').hidden=true;const ended=game.winner!==null||game.move_count===9;say(ended?(game.winner==='draw'?'Égalité !':(game.winner===role?'Victoire !':'Défaite !')):(game.turn===role?'À toi de jouer !':'Tour de ton adversaire…'));
$('status').classList.toggle('game-result',ended);const board=$('board');const oldBoard=previousRoomId===roomId?previousBoard:null;board.replaceChildren();game.board.forEach((entry,pos)=>{const btn=document.createElement('button');btn.className='cell';btn.disabled=!!entry||ended||game.turn!==role;btn.setAttribute('aria-label','Case '+(pos+1));if(entry){const item=decks[entry.played_by][entry.hand_index];const face=card(item[0],item[1],entry.owner,item[2]);if(oldBoard&&oldBoard[pos]===null){btn.classList.add('just-placed')}else if(oldBoard&&oldBoard[pos]){try{const prior=JSON.parse(oldBoard[pos]);if(prior.owner!==entry.owner)btn.classList.add('just-captured')}catch{}}btn.append(face)}else{btn.textContent='✦';btn.onclick=()=>move(pos)}board.append(btn)});
previousBoard=game.board.map(entry=>entry?JSON.stringify(entry):null);previousRoomId=roomId;
for(const player of ['host','guest']){const hand=$(player+'Hand');hand.replaceChildren();decks[player].forEach((item,i)=>{if(game.board.some(x=>x?.played_by===player&&x?.hand_index===i))return;const btn=document.createElement('button');btn.className=selected===i&&role===player?'active':'';btn.disabled=player!==role||ended||game.turn!==role;btn.append(card(item[0],item[1],player,item[2]));btn.onclick=()=>{selected=i;render()};hand.append(btn)})}}
async function move(pos){if(selected===null){say('Choisis une carte avant de sélectionner une case.');return}if(working)return;working=true;try{const {error}=await supabase.rpc('slay_custom_move',{p_room:roomId,p_hand_index:selected,p_position:pos});if(error)throw error;selected=null;await load()}catch(e){say('Coup refusé : '+e.message)}finally{working=false}}
async function action(fn){if(working)return;working=true;persistentError=null;try{await fn()}catch(e){const msg=e.message||String(e);persistentError='Erreur : '+msg+(msg.toLowerCase().includes('expir')||msg.toLowerCase().includes('introuvable')?' — Créez une nouvelle salle depuis cet écran sur les deux appareils.':'');$('status').textContent=persistentError}finally{working=false}}
$('create').onclick=()=>action(async()=>{const result=await createOnlineRoom();roomId=result.room_id;await load();say('Salle créée ! Partage le code avec ton ami.')});
$('join').onclick=()=>action(async()=>{roomId=await joinOnlineRoom($('code').value);await load();say('Salon rejoint ! Sélectionne ton deck et clique sur « Valider mon deck ».')});
$('start').onclick=()=>action(async()=>{const {error}=await supabase.rpc('slay_custom_start',{p_room:roomId});if(error)throw error;await load()});
$('submitDeck').onclick=()=>action(async()=>{if(!roomId)throw Error('Crée ou rejoins un salon avant de valider ton deck');const deck=selectedLocalDeck();if(!deck)throw Error('Aucun deck sélectionné');const normalize=v=>typeof v==='string'&&/^A\+*$/.test(v)?10+v.length-1:Number(v);const cards=deck.cards.map(c=>({...c,v:Array.isArray(c.v)?c.v.map(normalize):[]}));const invalid=cards.find(c=>!Array.isArray(c.v)||c.v.length!==4||c.v.some(v=>!Number.isInteger(v)||v<0||v>20));if(invalid)throw Error('Valeur non reconnue pour '+invalid.name+' : '+JSON.stringify(invalid.v));const {error}=await supabase.rpc('slay_custom_submit_deck',{p_room:roomId,p_cards:cards});if(error){const detail=cards.map(c=>c.name+' ['+c.v.join(', ')+']').join(' · ');throw Error(error.message+' | Valeurs envoyées : '+detail)}await load();say('Deck enregistré pour ce duel !')});
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(room.room_code);say('Code '+room.room_code+' copié !')}catch{say('Code à copier : '+room.room_code)}};
$('code').oninput=()=>{$('code').value=$('code').value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)};
if(new URLSearchParams(location.search).get('create')==='1'){$('create').click();}
setInterval(()=>{if(roomId&&!working)load().catch(e=>say('Synchronisation : '+e.message))},2500);
</script></body></html>
