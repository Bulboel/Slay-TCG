<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triade of Hackenia — Duel synchronisé</title><style>
*{box-sizing:border-box}body{background:radial-gradient(circle at top,#61482d,#162330 70%);color:#f4e1b5;font:16px system-ui;margin:0;padding:14px}main{max-width:650px;margin:auto}h1{text-align:center;font-family:Georgia,serif}p{line-height:1.5}button,input{font:inherit;border-radius:8px;padding:10px}button{background:#e3c486;color:#251b11;border:1px solid #f5d99f;cursor:pointer}button:disabled{opacity:.45}input{width:130px;text-transform:uppercase}header,.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}#roomInfo,#status{text-align:center;padding:10px;min-height:35px}#board{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#c3a16c;border:5px solid #7d5a32;border-radius:14px;padding:8px;aspect-ratio:1;margin:12px auto;max-width:480px}.cell{background:#ebd5a4;display:grid;place-items:center;border:2px solid #8a6d43;padding:2px;min-width:0}.card{background:#203c3d;color:white;border:3px solid #6ac782;border-radius:9px;position:relative;aspect-ratio:3/4;width:100%;display:grid;place-items:center;font-weight:700;font-size:clamp(10px,2vw,14px)}.guest{border-color:#ef8383;background:#4d2c38}.card span{position:absolute}.t{top:2px}.r{right:5px}.b{bottom:2px}.l{left:5px}.card strong{font-size:clamp(9px,2vw,13px)}.hand{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}.hand button{width:18%;padding:2px;min-width:55px;background:transparent;border:2px solid transparent}.hand button.active{border-color:#ffdd77}.hand .card{width:100%}.label{text-align:center;font-weight:700;margin:14px 0 6px}.note{font-size:.85rem;color:#d2c19e}#roomPanel{border:1px solid #a88953;border-radius:12px;padding:12px}#gamePanel[hidden]{display:none}</style></head><body><main><h1>⚔ Duel synchronisé d'Hackénia</h1><p class="note">Laboratoire à deux appareils. Decks de démonstration fixes, règles classiques uniquement. Le jeu principal et ses animations ne sont pas encore connectés.</p><section id="roomPanel"><div class="actions"><button id="create">Créer une salle</button><input id="code" maxlength="6" placeholder="Code à 6 caractères" aria-label="Code du salon"><button id="join">Rejoindre</button></div><div id="roomInfo"></div><div class="actions"><button id="copy" hidden>📋 Copier le code</button><button id="start" hidden>Démarrer le duel</button></div></section><div id="status" role="status"></div><section id="gamePanel" hidden><div class="label">Main du joueur rouge</div><div class="hand" id="guestHand"></div><div id="board"></div><div class="label">Main du joueur vert</div><div class="hand" id="hostHand"></div></section><p class="note"><a style="color:#efd18e" href="../index.html">Retour au jeu</a></p></main><script type="module">
import {supabase,ensureOnlineIdentity,createOnlineRoom,joinOnlineRoom,getOnlineRoom} from './supabase-client.js';
const $=id=>document.getElementById(id);
const decks={host:[['Kala',[6,5,7,4]],['Bolduc',[7,4,5,5]],['Jhimm',[4,7,5,7]],['Grimgors',[8,2,3,8]],['Araignée',[3,6,5,4]]],guest:[['Hilam',[9,7,8,10]],['Kayla',[8,10,9,7]],['Gardienne',[7,7,5,3]],['Frolgor',[7,7,2,2]],['Ven',[8,6,2,4]]]};
let roomId=null,role=null,game=null,room=null,selected=null,working=false;
function say(message){$('status').textContent=message}
function card(name,v,owner){const d=document.createElement('div');d.className='card '+owner;d.innerHTML='<span class="t">'+v[0]+'</span><span class="r">'+v[1]+'</span><span class="b">'+v[2]+'</span><span class="l">'+v[3]+'</span><strong></strong>';d.querySelector('strong').textContent=name;return d}
async function load(){if(!roomId)return;room=await getOnlineRoom(roomId);const user=await ensureOnlineIdentity();role=room.host_id===user.id?'host':'guest';$('roomInfo').textContent='Salle '+room.room_code+' — '+(room.guest_id?'2 joueurs connectés':'en attente du second joueur');$('copy').hidden=false;$('start').hidden=!room.guest_id;
const {data,error}=await supabase.from('slay_online_test_games').select('*').eq('room_id',roomId).maybeSingle();if(error){if(error.code==='42P01'){say('Exécute d’abord le script SQL de synchronisation dans Supabase.');return}throw error}game=data;if(game)render();}
function render(){$('gamePanel').hidden=false;$('start').hidden=true;const ended=game.winner!==null||game.move_count===9;say(ended?(game.winner==='draw'?'Égalité !':(game.winner===role?'Victoire !':'Défaite !')):(game.turn===role?'À toi de jouer !':'Tour de ton adversaire…'));
const board=$('board');board.replaceChildren();game.board.forEach((entry,pos)=>{const btn=document.createElement('button');btn.className='cell';btn.disabled=!!entry||ended||game.turn!==role;btn.setAttribute('aria-label','Case '+(pos+1));if(entry){const item=decks[entry.played_by][entry.hand_index];btn.append(card(item[0],item[1],entry.owner))}else{btn.textContent='✦';btn.onclick=()=>move(pos)}board.append(btn)});
for(const player of ['host','guest']){const hand=$(player+'Hand');hand.replaceChildren();decks[player].forEach((item,i)=>{if(game.board.some(x=>x?.played_by===player&&x?.hand_index===i))return;const btn=document.createElement('button');btn.className=selected===i&&role===player?'active':'';btn.disabled=player!==role||ended||game.turn!==role;btn.append(card(item[0],item[1],player));btn.onclick=()=>{selected=i;render()};hand.append(btn)})}}
async function move(pos){if(selected===null){say('Choisis une carte avant de sélectionner une case.');return}if(working)return;working=true;try{const {error}=await supabase.rpc('slay_test_move',{p_room:roomId,p_hand_index:selected,p_position:pos});if(error)throw error;selected=null;await load()}catch(e){say('Coup refusé : '+e.message)}finally{working=false}}
async function action(fn){if(working)return;working=true;try{await fn()}catch(e){say('Erreur : '+e.message)}finally{working=false}}
$('create').onclick=()=>action(async()=>{const result=await createOnlineRoom();roomId=result.room_id;await load();say('Salle créée ! Partage le code avec ton ami.')});
$('join').onclick=()=>action(async()=>{roomId=await joinOnlineRoom($('code').value);await load();say('Salon rejoint !')});
$('start').onclick=()=>action(async()=>{const {error}=await supabase.rpc('slay_test_start',{p_room:roomId});if(error)throw error;await load()});
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(room.room_code);say('Code '+room.room_code+' copié !')}catch{say('Code à copier : '+room.room_code)}};
$('code').oninput=()=>{$('code').value=$('code').value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)};
setInterval(()=>{if(roomId&&!working)load().catch(e=>say('Synchronisation : '+e.message))},2500);
</script></body></html>
